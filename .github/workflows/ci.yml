name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests-windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Run-Tests.ps1

  tests-powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (PowerShell 7)
        shell: pwsh
        run: .\tests\Run-Tests.ps1
