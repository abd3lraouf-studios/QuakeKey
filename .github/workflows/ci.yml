name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [Windows PowerShell, PowerShell]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (${{ matrix.shell }})
        shell: ${{ matrix.shell == 'PowerShell' && 'pwsh' || 'powershell' }}
        run: .\tests\Run-Tests.ps1
