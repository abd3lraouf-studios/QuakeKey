name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (${{ matrix.shell }})
        shell: ${{ matrix.shell }}
        run: .\tests\Run-Tests.ps1
